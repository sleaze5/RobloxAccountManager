version: 2

updates:
    - package-ecosystem: gomod
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      allow:
          - dependency-type: direct
      ignore:
          - dependency-name: "*"
            update-types:
                - version-update:semver-major
      groups:
          go:
              patterns:
                  - "*"

    - package-ecosystem: gomod
      directory: /build/tools
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      allow:
          - dependency-name: github.com/go-task/task/v3
          - dependency-name: github.com/golangci/golangci-lint/v2
          - dependency-name: golang.org/x/vuln
      ignore:
          - dependency-name: "*"
            update-types:
                - version-update:semver-major
      groups:
          go-tools:
              patterns:
                  - "*"

    - package-ecosystem: bun
      directory: /frontend
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      ignore:
          - dependency-name: "@typescript/native"
          - dependency-name: "*"
            update-types:
                - version-update:semver-major
      groups:
          frontend:
              patterns:
                  - "*"

    - package-ecosystem: github-actions
      directories:
          - /
          - /.github/actions/*
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      ignore:
          - dependency-name: "*"
            update-types:
                - version-update:semver-major
      groups:
          actions:
              patterns:
                  - "*"
