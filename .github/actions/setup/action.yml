name: Set up the runner
description: "Prepare a checked-out runner for every task, including the complete local workflow: native compilation, Go, which runs the pinned Task, and Bun."

runs:
    using: composite
    steps:
        - name: Set up native compilation
          uses: ./.github/actions/setup-native

        - name: Set up Go
          uses: ./.github/actions/setup-go
          with:
              cache: native

        - name: Set up Bun
          uses: ./.github/actions/setup-bun
