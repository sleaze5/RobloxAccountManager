name: "Set up the runner"
description: "Prepare a checked-out runner for task commands: Go, Task, and optionally Bun, plus the operating system's build requirements."

inputs:
    bun:
        description: "Set up Bun for frontend tasks."
        default: "true"

runs:
    using: "composite"
    steps:
        # Defender real-time scanning slows builds on the disposable runners.
        - name: "Pause Defender scanning"
          if: "runner.os == 'Windows'"
          shell: "pwsh"
          run: |
              try {
                  Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
              } catch {
                  Write-Warning "Defender scanning could not be paused: $_"
              }

        - name: "Install system libraries"
          if: "runner.os == 'Linux'"
          shell: "bash"
          run: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

        - name: "Set up Go"
          uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e"
          with:
              go-version-file: "go.mod"
              cache-dependency-path: "go.sum"

        - name: "Set up Bun"
          if: "inputs.bun == 'true'"
          uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
          with:
              bun-version: "1.3.x"

        - name: "Set up Task"
          uses: "go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e"
          with:
              version: "3.x"
