name: Set up Go
description: Set up the Go version pinned in go.mod, which also runs the pinned Task, with the module and build caches.

runs:
    using: composite
    steps:
        - name: Set up Go
          uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
          with:
              go-version-file: go.mod
              cache-dependency-path: |
                  go.sum
                  build/tools/go.sum
