name: Set up Bun
description: Set up the Bun version pinned in frontend/package.json.

runs:
    using: composite
    steps:
        - name: Read the Bun version
          id: bun
          shell: bash
          run: echo "version=$(jq -r .devEngines.packageManager.version frontend/package.json)" >> "$GITHUB_OUTPUT"

        - name: Set up Bun
          uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
          with:
              bun-version: ${{ steps.bun.outputs.version }}
