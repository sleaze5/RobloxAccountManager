name: Land
description: Push the current commit to a branch, run the Check workflow on it, and push the same commit to the default branch once Check passes.

inputs:
    branch:
        description: The branch that Check runs on before the commit lands.
        required: true

runs:
    using: composite
    steps:
        - name: Land
          shell: bash
          env:
              BRANCH: ${{ inputs.branch }}
              DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              GH_TOKEN: ${{ github.token }}
          run: |
              set -eu
              sha=$(git rev-parse HEAD)
              git push --force origin "HEAD:refs/heads/$BRANCH"
              gh workflow run check.yml --ref "$BRANCH"
              run=""
              for attempt in $(seq 30); do
                  run=$(gh run list --workflow check.yml --event workflow_dispatch --commit "$sha" --json databaseId --jq '.[0].databaseId')
                  [ -n "$run" ] && break
                  sleep 5
              done
              gh run watch "$run" --exit-status --compact --interval 15
              git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
