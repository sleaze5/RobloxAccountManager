name: Land
description: Push the current commit to a branch, run the Check workflow on it, and push the same commit to the default branch once Check passes.

inputs:
    branch:
        description: The branch that Check runs on before the commit lands.
        required: true
    deploy-key:
        description: Private SSH key of the repository deploy key that is allowed to bypass the default branch rules.
        required: true

runs:
    using: composite
    steps:
        - name: Land
          shell: bash
          env:
              BRANCH: ${{ inputs.branch }}
              DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              DEPLOY_KEY: ${{ inputs.deploy-key }}
              GH_TOKEN: ${{ github.token }}
              REPOSITORY: ${{ github.repository }}
          run: |
              set -eu
              mkdir -p "$HOME/.ssh"
              printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/land_deploy_key"
              chmod 600 "$HOME/.ssh/land_deploy_key"
              ssh-keyscan github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
              export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/land_deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
              remote="git@github.com:$REPOSITORY.git"
              sha=$(git rev-parse HEAD)
              git push --force "$remote" "HEAD:refs/heads/$BRANCH"
              gh workflow run check.yml --ref "$BRANCH"
              run=""
              for attempt in $(seq 30); do
                  run=$(gh run list --workflow check.yml --event workflow_dispatch --commit "$sha" --json databaseId --jq '.[0].databaseId')
                  [ -n "$run" ] && break
                  sleep 5
              done
              if [ -z "$run" ]; then
                  echo "The Check run for $sha did not start." >&2
                  exit 1
              fi
              gh run watch "$run" --exit-status --compact --interval 15
              git push "$remote" "HEAD:refs/heads/$DEFAULT_BRANCH"
