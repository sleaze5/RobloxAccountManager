name: Update dependencies

on:
    schedule:
        - cron: 17 6 * * 1
    workflow_dispatch:
        inputs:
            scope:
                description: Update every dependency, or only what Dependabot cannot update.
                type: choice
                options:
                    - all
                    - uncovered
                default: all

permissions:
    contents: read

concurrency:
    group: update-dependencies
    cancel-in-progress: false

jobs:
    update:
        name: Update
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        permissions:
            contents: write
            actions: write
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Set up native compilation
              uses: ./.github/actions/setup-native

            - name: Set up Go
              uses: ./.github/actions/setup-go
              with:
                  cache: native

            - name: Set up Bun
              uses: ./.github/actions/setup-bun

            - name: Update
              env:
                  SCOPE: ${{ inputs.scope || 'uncovered' }}
                  DEPS_SUMMARY_FILE: ${{ runner.temp }}/dependencies.md
              run: |
                  go tool -modfile build/tools/go.mod task update -- "--$SCOPE"
                  cat "$DEPS_SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"

            - name: Set up the updated Bun
              uses: ./.github/actions/setup-bun

            - name: Install with the updated Bun
              working-directory: frontend
              run: bun install

            - name: Commit
              id: commit
              run: |
                  if git diff --quiet; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit --all -m "Update dependencies"
                  echo "changed=true" >> "$GITHUB_OUTPUT"

            - name: Land
              if: steps.commit.outputs.changed == 'true'
              uses: ./.github/actions/land
              with:
                  branch: deps/update
                  deploy-key: ${{ secrets.LAND_DEPLOY_KEY }}
