name: Update dependencies

on:
    schedule:
        - cron: 17 6 * * 1
    workflow_dispatch:
        inputs:
            scope:
                description: Update every dependency, or only what Dependabot cannot update.
                type: choice
                options:
                    - all
                    - uncovered
                default: all

permissions:
    contents: read

concurrency:
    group: update-dependencies
    cancel-in-progress: false

jobs:
    update:
        name: Update
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        permissions:
            contents: write
            actions: write
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Set up
              uses: ./.github/actions/setup

            - name: Update
              id: update
              env:
                  SCOPE: ${{ inputs.scope || 'uncovered' }}
                  DEPS_SUMMARY_FILE: ${{ runner.temp }}/dependencies.md
              run: |
                  task update -- "--$SCOPE"
                  echo "bun=$(jq -r .devEngines.packageManager.version frontend/package.json)" >> "$GITHUB_OUTPUT"

            - name: Set up the updated Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
              with:
                  bun-version: ${{ steps.update.outputs.bun }}

            - name: Install with the updated Bun
              working-directory: frontend
              run: bun install

            - name: Commit
              id: commit
              run: |
                  if git diff --quiet; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit --all -m "Update dependencies" -m "$(cat "$RUNNER_TEMP/dependencies.md")"
                  echo "changed=true" >> "$GITHUB_OUTPUT"

            - name: Land
              if: steps.commit.outputs.changed == 'true'
              uses: ./.github/actions/land
              with:
                  branch: deps/update
