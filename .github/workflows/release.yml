name: Release

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    check:
        name: Check
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        env:
            GH_TOKEN: ${{ github.token }}
        outputs:
            version: ${{ steps.version.outputs.version }}
            tag: ${{ steps.version.outputs.tag }}
            prerelease: ${{ steps.version.outputs.prerelease }}
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Read version
              id: version
              run: |
                  if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                      echo "Run the release from the main branch." >&2
                      exit 1
                  fi
                  version=$(tr -d '[:space:]' < internal/appmeta/VERSION)
                  tag="v$version"
                  if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
                      echo "Tag $tag already exists. Change internal/appmeta/VERSION before you release." >&2
                      exit 1
                  fi
                  case "$version" in
                      *-*) prerelease=true ;;
                      *) prerelease=false ;;
                  esac
                  {
                      echo "version=$version"
                      echo "tag=$tag"
                      echo "prerelease=$prerelease"
                  } >> "$GITHUB_OUTPUT"

    build:
        name: Build ${{ matrix.name }}
        needs: check
        strategy:
            matrix:
                include:
                    - name: linux
                      targets: linux-amd64
                    - name: windows
                      targets: windows-amd64
        uses: ./.github/workflows/build-targets.yml
        with:
            targets: ${{ matrix.targets }}
            artifact: ${{ matrix.name }}
            retention-days: 1

    publish:
        name: Publish
        needs:
            - check
            - build
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: write
        env:
            # The Wails CLI links WebKitGTK when cgo is on, and this job skips
            # those libraries. Without cgo, Go also never reuses a cgo build of
            # the CLI from the shared build cache.
            CGO_ENABLED: "0"
            GH_TOKEN: ${{ github.token }}
            VERSION: ${{ needs.check.outputs.version }}
            TAG: ${{ needs.check.outputs.tag }}
            PRERELEASE: ${{ needs.check.outputs.prerelease }}
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Set up
              uses: ./.github/actions/setup
              with:
                  bun: "false"
                  system-libraries: "false"

            - name: Download builds
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  path: ${{ runner.temp }}/release
                  merge-multiple: true

            - name: Package and sign
              id: package
              env:
                  UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  if [ -z "${UPDATER_PRIVATE_KEY:-}" ]; then
                      echo "Add the UPDATER_PRIVATE_KEY repository secret before you release." >&2
                      exit 1
                  fi
                  wails=$(sed -nE "s/^[[:space:]]*WAILS_CLI:[[:space:]]*[\"']?([^\"'[:space:]]+).*/\1/p" Taskfile.yml | head -n 1)
                  if [ -z "$wails" ]; then
                      echo "WAILS_CLI was not found in Taskfile.yml." >&2
                      exit 1
                  fi
                  release="$RUNNER_TEMP/release"
                  manifest="$release/manifest.json"
                  key="$RUNNER_TEMP/updater.key"
                  trap 'rm -f "$key"' EXIT
                  (umask 077 && printf '%s' "$UPDATER_PRIVATE_KEY" > "$key")
                  go run "$wails" updater manifest -version "$VERSION" -key "$key" \
                      -url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" \
                      -output "$manifest" \
                      "$release/RobloxAccountManager-windows-x64.zip" \
                      "$release/RobloxAccountManager-linux-x64.tar.gz"
                  rm -f "$key"
                  go run "$wails" updater verify -manifest "$manifest" -publickey internal/appmeta/updater.key.pub
                  echo "directory=$release" >> "$GITHUB_OUTPUT"

            - name: Publish release
              env:
                  RELEASE: ${{ steps.package.outputs.directory }}
              run: |
                  set -euo pipefail
                  arguments=(
                      release create "$TAG"
                      "$RELEASE/RobloxAccountManager.exe"
                      "$RELEASE/RobloxAccountManager-windows-x64.zip"
                      "$RELEASE/RobloxAccountManager-linux-x64.tar.gz"
                      "$RELEASE/manifest.json"
                      THIRD_PARTY_LICENSES.txt
                      --target "$GITHUB_SHA"
                      --title "$TAG"
                      --generate-notes
                  )
                  if [ "$PRERELEASE" = "true" ]; then
                      arguments+=(--prerelease)
                  fi
                  gh "${arguments[@]}"
