name: Release

on:
    push:
        branches:
            - main
        paths:
            - internal/appmeta/VERSION
    workflow_dispatch:
        inputs:
            rehearsal:
                description: Rehearse release preparation with a throwaway signing key. Nothing is published.
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    check:
        name: Check
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        env:
            GH_TOKEN: ${{ github.token }}
            REHEARSAL: ${{ inputs.rehearsal }}
        outputs:
            version: ${{ steps.version.outputs.version }}
            tag: ${{ steps.version.outputs.tag }}
            prerelease: ${{ steps.version.outputs.prerelease }}
            matrix: ${{ steps.targets.outputs.matrix }}
            targets: ${{ steps.targets.outputs.targets }}
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Read version
              id: version
              run: |
                  set -euo pipefail
                  version=$(tr -d '[:space:]' < internal/appmeta/VERSION)
                  tag="v$version"
                  if [ "$REHEARSAL" != "true" ]; then
                      if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                          echo "Run the release from the main branch." >&2
                          exit 1
                      fi
                      # Only a confirmed 404 means the tag is free. gh release create
                      # would attach the release to an existing tag and ignore --target.
                      if output=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1); then
                          echo "Tag $tag already exists. Change internal/appmeta/VERSION before you release." >&2
                          exit 1
                      elif ! grep -q "HTTP 404" <<< "$output"; then
                          printf 'Could not check whether tag %s exists:\n%s\n' "$tag" "$output" >&2
                          exit 1
                      fi
                  fi
                  case "$version" in
                      *-*) prerelease=true ;;
                      *) prerelease=false ;;
                  esac
                  {
                      echo "version=$version"
                      echo "tag=$tag"
                      echo "prerelease=$prerelease"
                  } >> "$GITHUB_OUTPUT"

            - name: Define targets
              id: targets
              run: |
                  set -euo pipefail
                  matrix='[
                      {"name": "linux", "targets": "linux-amd64"},
                      {"name": "macos", "targets": "darwin-arm64 darwin-amd64"},
                      {"name": "windows", "targets": "windows-amd64 windows-arm64"}
                  ]'
                  {
                      echo "matrix=$(jq -c . <<< "$matrix")"
                      echo "targets=$(jq -r '[.[].targets] | join(" ")' <<< "$matrix")"
                  } >> "$GITHUB_OUTPUT"

    build:
        name: Build ${{ matrix.name }}
        needs: check
        strategy:
            matrix:
                include: ${{ fromJSON(needs.check.outputs.matrix) }}
        uses: ./.github/workflows/build-targets.yml
        with:
            targets: ${{ matrix.targets }}
            artifact: ${{ matrix.name }}
            retention-days: 7

    publish:
        name: ${{ inputs.rehearsal && 'Rehearse' || 'Publish' }}
        needs:
            - check
            - build
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
            TAG: ${{ needs.check.outputs.tag }}
            PRERELEASE: ${{ needs.check.outputs.prerelease }}
        steps:
            - name: Choose the release folder
              run: echo "RELEASE=$RUNNER_TEMP/release" >> "$GITHUB_ENV"

            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Set up
              uses: ./.github/actions/setup
              with:
                  system-libraries: "false"

            - name: Download builds
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  path: ${{ env.RELEASE }}
                  merge-multiple: true

            - name: Prepare release
              env:
                  SIGNING: ${{ inputs.rehearsal && 'rehearsal' || 'production' }}
                  TARGETS: ${{ needs.check.outputs.targets }}
                  UPDATER_PRIVATE_KEY: ${{ !inputs.rehearsal && secrets.UPDATER_PRIVATE_KEY || '' }}
              run: go tool -modfile build/tools/go.mod task release:prepare RELEASE_DIR="$RELEASE" TARGETS="$TARGETS" REPOSITORY="$GITHUB_REPOSITORY" SIGNING="$SIGNING"

            - name: Upload rehearsal
              if: inputs.rehearsal
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: release-rehearsal
                  path: ${{ env.RELEASE }}
                  if-no-files-found: error
                  retention-days: 7

            - name: Publish release
              if: ${{ !inputs.rehearsal }}
              run: |
                  set -euo pipefail
                  mapfile -t assets < <(find "$RELEASE" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.exe' -o -name manifest.json \) | sort)
                  arguments=(
                      release create "$TAG"
                      "${assets[@]}"
                      THIRD_PARTY_LICENSES.txt
                      --target "$GITHUB_SHA"
                      --title "$TAG"
                      --generate-notes
                  )
                  if [ "$PRERELEASE" = "true" ]; then
                      arguments+=(--prerelease)
                  fi
                  gh "${arguments[@]}"
