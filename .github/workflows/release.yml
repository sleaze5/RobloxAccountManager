name: "Release"

on:
    workflow_dispatch:

permissions:
    contents: "read"

concurrency:
    group: "release"
    cancel-in-progress: false

jobs:
    linux:
        name: "Build Linux"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 30
        env:
            CGO_ENABLED: "1"
        steps:
            - name: "Check out"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
              with:
                  persist-credentials: false

            - name: "Install system libraries"
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

            - name: "Set up Go"
              uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e"
              with:
                  go-version-file: "go.mod"
                  cache-dependency-path: "go.sum"

            - name: "Set up Bun"
              uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
              with:
                  bun-version: "1.3.x"

            - name: "Set up Task"
              uses: "go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e"
              with:
                  version: "3.x"

            - name: "Build"
              run: "task build:linux-amd64"

            - name: "Check that the build did not change source files"
              run: |
                  changes=$(git status --porcelain)
                  if [ -n "$changes" ]; then
                      printf 'The build changed source files. Run task fix, commit, and release again.\n%s\n' "$changes" >&2
                      exit 1
                  fi

            - name: "Package"
              run: 'tar -czf "$RUNNER_TEMP/RobloxAccountManager-linux-x64.tar.gz" -C dist/linux-amd64 RobloxAccountManager'

            - name: "Upload"
              uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
              with:
                  name: "linux"
                  path: "${{ runner.temp }}/RobloxAccountManager-linux-x64.tar.gz"
                  if-no-files-found: "error"
                  retention-days: 1

    release:
        name: "Build and publish"
        needs: "linux"
        runs-on: "windows-2025"
        timeout-minutes: 30
        permissions:
            contents: "write"
        env:
            CGO_ENABLED: "1"
            GH_TOKEN: "${{ github.token }}"
        defaults:
            run:
                shell: "pwsh"
        steps:
            - name: "Check out"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
              with:
                  persist-credentials: false

            - name: "Read version"
              id: "version"
              run: |
                  if ($env:GITHUB_REF -ne "refs/heads/main") {
                      throw "Run the release from the main branch."
                  }
                  $version = (Get-Content -LiteralPath "internal/appmeta/VERSION" -Raw).Trim()
                  $tag = "v$version"
                  gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>$null
                  if ($LASTEXITCODE -eq 0) {
                      throw "Tag $tag already exists. Change internal/appmeta/VERSION before you release."
                  }
                  "version=$version" >> $env:GITHUB_OUTPUT
                  "tag=$tag" >> $env:GITHUB_OUTPUT
                  "prerelease=$($version.Contains('-'))" >> $env:GITHUB_OUTPUT
                  exit 0

            - name: "Set up Go"
              uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e"
              with:
                  go-version-file: "go.mod"
                  cache-dependency-path: "go.sum"

            - name: "Set up Bun"
              uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
              with:
                  bun-version: "1.3.x"

            - name: "Set up Task"
              uses: "go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e"
              with:
                  version: "3.x"

            - name: "Build"
              run: "task build:windows-amd64"

            - name: "Check that the build did not change source files"
              run: |
                  $changes = git status --porcelain
                  if ($changes) {
                      throw "The build changed source files. Run task fix, commit, and release again.`n$($changes -join "`n")"
                  }

            - name: "Download Linux build"
              uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
              with:
                  name: "linux"
                  path: "${{ runner.temp }}/linux"

            - name: "Package and sign"
              id: "package"
              env:
                  UPDATER_PRIVATE_KEY: "${{ secrets.UPDATER_PRIVATE_KEY }}"
              run: |
                  if (-not $env:UPDATER_PRIVATE_KEY) {
                      throw "Add the UPDATER_PRIVATE_KEY repository secret before you release."
                  }
                  $wails = [regex]::Match((Get-Content -LiteralPath "Taskfile.yml" -Raw), 'WAILS_CLI: "([^"]+)"').Groups[1].Value
                  if (-not $wails) {
                      throw "WAILS_CLI was not found in Taskfile.yml."
                  }
                  $release = Join-Path $env:RUNNER_TEMP "release"
                  New-Item -ItemType Directory -Force -Path $release | Out-Null
                  $executable = "dist/windows-amd64/RobloxAccountManager.exe"
                  Copy-Item -LiteralPath $executable -Destination $release
                  $archive = Join-Path $release "RobloxAccountManager-windows-x64.zip"
                  Compress-Archive -LiteralPath $executable -DestinationPath $archive
                  $linuxArchive = Join-Path $release "RobloxAccountManager-linux-x64.tar.gz"
                  Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "linux/RobloxAccountManager-linux-x64.tar.gz") -Destination $linuxArchive
                  $manifest = Join-Path $release "manifest.json"
                  $key = Join-Path $env:RUNNER_TEMP "updater.key"
                  try {
                      [IO.File]::WriteAllText($key, $env:UPDATER_PRIVATE_KEY)
                      go run $wails updater manifest -version "${{ steps.version.outputs.version }}" -key $key `
                          -url-prefix "https://github.com/$env:GITHUB_REPOSITORY/releases/download/${{ steps.version.outputs.tag }}/" `
                          -output $manifest $archive $linuxArchive
                      if ($LASTEXITCODE -ne 0) {
                          throw "Manifest generation failed with exit code $LASTEXITCODE."
                      }
                  } finally {
                      Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue
                  }
                  go run $wails updater verify -manifest $manifest -publickey "internal/appmeta/updater.key.pub"
                  if ($LASTEXITCODE -ne 0) {
                      throw "Manifest verification failed with exit code $LASTEXITCODE."
                  }
                  "directory=$release" >> $env:GITHUB_OUTPUT

            - name: "Publish release"
              run: |
                  $release = "${{ steps.package.outputs.directory }}"
                  $arguments = @(
                      "release", "create", "${{ steps.version.outputs.tag }}",
                      (Join-Path $release "RobloxAccountManager.exe"),
                      (Join-Path $release "RobloxAccountManager-windows-x64.zip"),
                      (Join-Path $release "RobloxAccountManager-linux-x64.tar.gz"),
                      (Join-Path $release "manifest.json"),
                      "--target", $env:GITHUB_SHA,
                      "--title", "${{ steps.version.outputs.tag }}",
                      "--generate-notes"
                  )
                  if ("${{ steps.version.outputs.prerelease }}" -eq "True") {
                      $arguments += "--prerelease"
                  }
                  gh @arguments
