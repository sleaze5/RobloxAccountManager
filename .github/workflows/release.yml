name: Release

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    check:
        name: Check
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        env:
            GH_TOKEN: ${{ github.token }}
        outputs:
            version: ${{ steps.version.outputs.version }}
            tag: ${{ steps.version.outputs.tag }}
            prerelease: ${{ steps.version.outputs.prerelease }}
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Read version
              id: version
              run: |
                  if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                      echo "Run the release from the main branch." >&2
                      exit 1
                  fi
                  version=$(tr -d '[:space:]' < internal/appmeta/VERSION)
                  tag="v$version"
                  if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
                      echo "Tag $tag already exists. Change internal/appmeta/VERSION before you release." >&2
                      exit 1
                  fi
                  case "$version" in
                      *-*) prerelease=true ;;
                      *) prerelease=false ;;
                  esac
                  {
                      echo "version=$version"
                      echo "tag=$tag"
                      echo "prerelease=$prerelease"
                  } >> "$GITHUB_OUTPUT"

    build:
        name: Build ${{ matrix.name }}
        needs: check
        strategy:
            matrix:
                include:
                    - name: linux
                      targets: linux-amd64
                    - name: macos
                      targets: darwin-arm64 darwin-amd64
                    - name: windows
                      targets: windows-amd64 windows-arm64
        uses: ./.github/workflows/build-targets.yml
        with:
            targets: ${{ matrix.targets }}
            artifact: ${{ matrix.name }}
            retention-days: 1

    publish:
        name: Publish
        needs:
            - check
            - build
        runs-on: windows-2025
        timeout-minutes: 15
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
        defaults:
            run:
                shell: pwsh
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Set up
              uses: ./.github/actions/setup
              with:
                  bun: "false"

            - name: Download builds
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  path: ${{ runner.temp }}/release
                  merge-multiple: true

            - name: Package and sign
              id: package
              env:
                  UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
              run: |
                  if (-not $env:UPDATER_PRIVATE_KEY) {
                      throw "Add the UPDATER_PRIVATE_KEY repository secret before you release."
                  }
                  $wails = [regex]::Match((Get-Content -LiteralPath "Taskfile.yml" -Raw), '(?m)^\s*WAILS_CLI:\s*["'']?([^"''\s]+)').Groups[1].Value
                  if (-not $wails) {
                      throw "WAILS_CLI was not found in Taskfile.yml."
                  }
                  $release = Join-Path $env:RUNNER_TEMP "release"
                  $archive = Join-Path $release "RobloxAccountManager-windows-x64.zip"
                  $arm64Archive = Join-Path $release "RobloxAccountManager-windows-arm64.zip"
                  $linuxArchive = Join-Path $release "RobloxAccountManager-linux-x64.tar.gz"
                  $macArchives = @(
                      (Join-Path $release "RobloxAccountManager-macos-arm64.zip"),
                      (Join-Path $release "RobloxAccountManager-macos-x64.zip")
                  )
                  $manifest = Join-Path $release "manifest.json"
                  $key = Join-Path $env:RUNNER_TEMP "updater.key"
                  try {
                      [IO.File]::WriteAllText($key, $env:UPDATER_PRIVATE_KEY)
                      go run $wails updater manifest -version "${{ needs.check.outputs.version }}" -key $key `
                          -url-prefix "https://github.com/$env:GITHUB_REPOSITORY/releases/download/${{ needs.check.outputs.tag }}/" `
                          -output $manifest $archive $arm64Archive $linuxArchive @macArchives
                      if ($LASTEXITCODE -ne 0) {
                          throw "Manifest generation failed with exit code $LASTEXITCODE."
                      }
                  } finally {
                      Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue
                  }
                  go run $wails updater verify -manifest $manifest -publickey "internal/appmeta/updater.key.pub"
                  if ($LASTEXITCODE -ne 0) {
                      throw "Manifest verification failed with exit code $LASTEXITCODE."
                  }
                  "directory=$release" >> $env:GITHUB_OUTPUT

            - name: Publish release
              run: |
                  $release = "${{ steps.package.outputs.directory }}"
                  $arguments = @(
                      "release", "create", "${{ needs.check.outputs.tag }}",
                      (Join-Path $release "RobloxAccountManager.exe"),
                      (Join-Path $release "RobloxAccountManager-windows-x64.zip"),
                      (Join-Path $release "RobloxAccountManager-arm64.exe"),
                      (Join-Path $release "RobloxAccountManager-windows-arm64.zip"),
                      (Join-Path $release "RobloxAccountManager-linux-x64.tar.gz"),
                      (Join-Path $release "RobloxAccountManager-macos-arm64.zip"),
                      (Join-Path $release "RobloxAccountManager-macos-x64.zip"),
                      (Join-Path $release "manifest.json"),
                      "THIRD_PARTY_LICENSES.txt",
                      "--target", $env:GITHUB_SHA,
                      "--title", "${{ needs.check.outputs.tag }}",
                      "--generate-notes"
                  )
                  if ("${{ needs.check.outputs.prerelease }}" -eq "true") {
                      $arguments += "--prerelease"
                  }
                  gh @arguments
