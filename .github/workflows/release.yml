name: "Release"

on:
    workflow_dispatch:

permissions:
    contents: "read"

concurrency:
    group: "release"
    cancel-in-progress: false

jobs:
    check:
        name: "Check"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 5
        env:
            GH_TOKEN: "${{ github.token }}"
        outputs:
            version: "${{ steps.version.outputs.version }}"
            tag: "${{ steps.version.outputs.tag }}"
            prerelease: "${{ steps.version.outputs.prerelease }}"
        steps:
            - name: "Check out"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
              with:
                  persist-credentials: false

            - name: "Read version"
              id: "version"
              run: |
                  if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                      echo "Run the release from the main branch." >&2
                      exit 1
                  fi
                  version=$(tr -d '[:space:]' < internal/appmeta/VERSION)
                  tag="v$version"
                  if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
                      echo "Tag $tag already exists. Change internal/appmeta/VERSION before you release." >&2
                      exit 1
                  fi
                  case "$version" in
                      *-*) prerelease=true ;;
                      *) prerelease=false ;;
                  esac
                  {
                      echo "version=$version"
                      echo "tag=$tag"
                      echo "prerelease=$prerelease"
                  } >> "$GITHUB_OUTPUT"

    linux:
        name: "Build Linux"
        needs: "check"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 30
        env:
            CGO_ENABLED: "1"
        steps:
            - name: "Check out"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
              with:
                  persist-credentials: false

            - name: "Install system libraries"
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

            - name: "Set up Go"
              uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e"
              with:
                  go-version-file: "go.mod"
                  cache-dependency-path: "go.sum"

            - name: "Set up Bun"
              uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
              with:
                  bun-version: "1.3.x"

            - name: "Set up Task"
              uses: "go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e"
              with:
                  version: "3.x"

            - name: "Build"
              run: "task build:linux-amd64"

            - name: "Check that the build did not change source files"
              run: |
                  changes=$(git status --porcelain)
                  if [ -n "$changes" ]; then
                      printf 'The build changed source files. Run task fix, commit, and release again.\n%s\n' "$changes" >&2
                      exit 1
                  fi

            - name: "Package"
              run: 'tar -czf "$RUNNER_TEMP/RobloxAccountManager-linux-x64.tar.gz" -C dist/linux-amd64 RobloxAccountManager'

            - name: "Upload"
              uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
              with:
                  name: "linux"
                  path: "${{ runner.temp }}/RobloxAccountManager-linux-x64.tar.gz"
                  if-no-files-found: "error"
                  retention-days: 1

    macos:
        name: "Build macOS"
        needs: "check"
        runs-on: "macos-15"
        timeout-minutes: 45
        env:
            CGO_ENABLED: "1"
        steps:
            - name: "Check out"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
              with:
                  persist-credentials: false

            - name: "Set up Go"
              uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e"
              with:
                  go-version-file: "go.mod"
                  cache-dependency-path: "go.sum"

            - name: "Set up Bun"
              uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
              with:
                  bun-version: "1.3.x"

            - name: "Set up Task"
              uses: "go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e"
              with:
                  version: "3.x"

            - name: "Build Apple silicon"
              run: "task build:darwin-arm64"

            - name: "Build Intel"
              run: "task build:darwin-amd64"

            - name: "Check that the build did not change source files"
              run: |
                  changes=$(git status --porcelain)
                  if [ -n "$changes" ]; then
                      printf 'The build changed source files. Run task fix, commit, and release again.\n%s\n' "$changes" >&2
                      exit 1
                  fi

            - name: "Package"
              run: |
                  mkdir -p "$RUNNER_TEMP/macos"
                  ditto -c -k --sequesterRsrc --keepParent dist/darwin-arm64/RobloxAccountManager.app "$RUNNER_TEMP/macos/RobloxAccountManager-macos-arm64.zip"
                  ditto -c -k --sequesterRsrc --keepParent dist/darwin-amd64/RobloxAccountManager.app "$RUNNER_TEMP/macos/RobloxAccountManager-macos-x64.zip"

            - name: "Upload"
              uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
              with:
                  name: "macos"
                  path: "${{ runner.temp }}/macos"
                  if-no-files-found: "error"
                  retention-days: 1

    windows:
        name: "Build Windows"
        needs: "check"
        runs-on: "windows-2025"
        timeout-minutes: 30
        env:
            CGO_ENABLED: "1"
        defaults:
            run:
                shell: "pwsh"
        steps:
            - name: "Pause Defender scanning"
              run: |
                  try {
                      Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
                  } catch {
                      Write-Warning "Defender scanning could not be paused: $_"
                  }

            - name: "Check out"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
              with:
                  persist-credentials: false

            - name: "Set up Go"
              uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e"
              with:
                  go-version-file: "go.mod"
                  cache-dependency-path: "go.sum"

            - name: "Set up Bun"
              uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
              with:
                  bun-version: "1.3.x"

            - name: "Set up Task"
              uses: "go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e"
              with:
                  version: "3.x"

            - name: "Build"
              run: "task build:windows-amd64"

            - name: "Check that the build did not change source files"
              run: |
                  $changes = git status --porcelain
                  if ($changes) {
                      throw "The build changed source files. Run task fix, commit, and release again.`n$($changes -join "`n")"
                  }

            - name: "Package"
              run: |
                  $package = Join-Path $env:RUNNER_TEMP "windows"
                  New-Item -ItemType Directory -Force -Path $package | Out-Null
                  $executable = "dist/windows-amd64/RobloxAccountManager.exe"
                  Copy-Item -LiteralPath $executable -Destination $package
                  Compress-Archive -LiteralPath $executable -DestinationPath (Join-Path $package "RobloxAccountManager-windows-x64.zip")

            - name: "Upload"
              uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
              with:
                  name: "windows"
                  path: "${{ runner.temp }}/windows"
                  if-no-files-found: "error"
                  retention-days: 1

    publish:
        name: "Publish"
        needs: ["check", "linux", "macos", "windows"]
        runs-on: "windows-2025"
        timeout-minutes: 15
        permissions:
            contents: "write"
        env:
            GH_TOKEN: "${{ github.token }}"
        defaults:
            run:
                shell: "pwsh"
        steps:
            - name: "Pause Defender scanning"
              run: |
                  try {
                      Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
                  } catch {
                      Write-Warning "Defender scanning could not be paused: $_"
                  }

            - name: "Check out"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
              with:
                  persist-credentials: false

            - name: "Set up Go"
              uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e"
              with:
                  go-version-file: "go.mod"
                  cache-dependency-path: "go.sum"

            - name: "Download builds"
              uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
              with:
                  path: "${{ runner.temp }}/release"
                  merge-multiple: true

            - name: "Package and sign"
              id: "package"
              env:
                  UPDATER_PRIVATE_KEY: "${{ secrets.UPDATER_PRIVATE_KEY }}"
              run: |
                  if (-not $env:UPDATER_PRIVATE_KEY) {
                      throw "Add the UPDATER_PRIVATE_KEY repository secret before you release."
                  }
                  $wails = [regex]::Match((Get-Content -LiteralPath "Taskfile.yml" -Raw), 'WAILS_CLI: "([^"]+)"').Groups[1].Value
                  if (-not $wails) {
                      throw "WAILS_CLI was not found in Taskfile.yml."
                  }
                  $release = Join-Path $env:RUNNER_TEMP "release"
                  $archive = Join-Path $release "RobloxAccountManager-windows-x64.zip"
                  $linuxArchive = Join-Path $release "RobloxAccountManager-linux-x64.tar.gz"
                  $macArchives = @(
                      (Join-Path $release "RobloxAccountManager-macos-arm64.zip"),
                      (Join-Path $release "RobloxAccountManager-macos-x64.zip")
                  )
                  $manifest = Join-Path $release "manifest.json"
                  $key = Join-Path $env:RUNNER_TEMP "updater.key"
                  try {
                      [IO.File]::WriteAllText($key, $env:UPDATER_PRIVATE_KEY)
                      go run $wails updater manifest -version "${{ needs.check.outputs.version }}" -key $key `
                          -url-prefix "https://github.com/$env:GITHUB_REPOSITORY/releases/download/${{ needs.check.outputs.tag }}/" `
                          -output $manifest $archive $linuxArchive @macArchives
                      if ($LASTEXITCODE -ne 0) {
                          throw "Manifest generation failed with exit code $LASTEXITCODE."
                      }
                  } finally {
                      Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue
                  }
                  go run $wails updater verify -manifest $manifest -publickey "internal/appmeta/updater.key.pub"
                  if ($LASTEXITCODE -ne 0) {
                      throw "Manifest verification failed with exit code $LASTEXITCODE."
                  }
                  "directory=$release" >> $env:GITHUB_OUTPUT

            - name: "Publish release"
              run: |
                  $release = "${{ steps.package.outputs.directory }}"
                  $arguments = @(
                      "release", "create", "${{ needs.check.outputs.tag }}",
                      (Join-Path $release "RobloxAccountManager.exe"),
                      (Join-Path $release "RobloxAccountManager-windows-x64.zip"),
                      (Join-Path $release "RobloxAccountManager-linux-x64.tar.gz"),
                      (Join-Path $release "RobloxAccountManager-macos-arm64.zip"),
                      (Join-Path $release "RobloxAccountManager-macos-x64.zip"),
                      (Join-Path $release "manifest.json"),
                      "THIRD_PARTY_LICENSES.txt",
                      "--target", $env:GITHUB_SHA,
                      "--title", "${{ needs.check.outputs.tag }}",
                      "--generate-notes"
                  )
                  if ("${{ needs.check.outputs.prerelease }}" -eq "true") {
                      $arguments += "--prerelease"
                  }
                  gh @arguments
