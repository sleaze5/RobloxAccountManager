name: Check

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: check-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    scope:
        name: Scope
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            frontend: ${{ steps.scope.outputs.frontend }}
            frontend-source: ${{ steps.scope.outputs.frontend-source }}
            go: ${{ steps.scope.outputs.go }}
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Find changed scopes
              id: scope
              env:
                  # A pull request runs on its merge commit, whose first parent is the base it merges into.
                  BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
                  HEAD: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  frontend=false
                  frontend_source=false
                  go=false
                  all() { frontend=true; frontend_source=true; go=true; }
                  # Without a base to compare with, such as on a new branch, after a force push, or on a manual run, everything runs.
                  if git cat-file -e "$BASE^{commit}" 2>/dev/null && git diff --name-only --no-renames -z "$BASE" "$HEAD" > "$RUNNER_TEMP/changes"; then
                      while IFS= read -r -d '' path; do
                          case "$path" in
                              frontend/* | scripts/*) frontend=true; frontend_source=true ;;
                              internal/* | *.go | go.sum) frontend=true; go=true ;;
                              docs/* | .claude/* | assets/showcase/* | README.md | AGENTS.md | LICENSE | THIRD_PARTY_LICENSES.txt | THIRD_PARTY_NOTICES.md) ;;
                              *) all ;;
                          esac
                      done < "$RUNNER_TEMP/changes"
                  else
                      all
                  fi
                  {
                      echo "frontend=$frontend"
                      echo "frontend-source=$frontend_source"
                      echo "go=$go"
                  } >> "$GITHUB_OUTPUT"

    frontend:
        name: Frontend
        needs: scope
        if: needs.scope.outputs.frontend == 'true'
        uses: ./.github/workflows/prepare-frontend.yml
        with:
            source-checks: ${{ needs.scope.outputs.frontend-source == 'true' }}

    go:
        name: Go
        needs: scope
        if: needs.scope.outputs.go == 'true'
        uses: ./.github/workflows/validate-go.yml

    ci:
        name: CI
        needs:
            - scope
            - frontend
            - go
        if: always()
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Require every selected check to pass and every other check to be skipped
              env:
                  RESULTS: ${{ toJSON(needs) }}
              run: |
                  echo "$RESULTS" | jq -e '
                      def expected($selected): if $selected == "true" then "success" else "skipped" end;
                      .scope.result == "success"
                      and .frontend.result == expected(.scope.outputs.frontend)
                      and .go.result == expected(.scope.outputs.go)
                  ' > /dev/null || {
                      echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' >&2
                      exit 1
                  }
