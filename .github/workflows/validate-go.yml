name: Validate Go

on:
    workflow_call:

permissions:
    contents: read

jobs:
    common:
        name: Go
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Set up Go
              uses: ./.github/actions/setup-go

            - name: Check
              run: go tool -modfile build/tools/go.mod task check:go

    native:
        name: Native (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-24.04
                    - windows-2025
                    - macos-15
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Set up native compilation
              uses: ./.github/actions/setup-native

            - name: Set up Go
              uses: ./.github/actions/setup-go

            - name: Check
              run: go tool -modfile build/tools/go.mod task check:native
