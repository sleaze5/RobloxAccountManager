name: Prepare frontend

on:
    workflow_call:
        inputs:
            source-checks:
                description: Also check frontend formatting and lint, and that @wailsio/runtime matches go.mod. The type checks always run.
                type: boolean
                default: true
        outputs:
            artifact:
                description: Name of this run's artifact with frontend/bindings and frontend/dist. Pass it to build-targets.yml.
                value: ${{ jobs.frontend.outputs.artifact }}

permissions:
    contents: read

jobs:
    frontend:
        name: Frontend
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        env:
            ARTIFACT: prepared-frontend
        outputs:
            artifact: ${{ env.ARTIFACT }}
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            # The keys list every file that binding generation or the frontend build reads. Add a file here when either starts to read it.
            - name: Restore the prepared frontend
              id: prepared
              uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
              with:
                  path: |
                      frontend/bindings
                      frontend/dist
                  key: frontend-${{ runner.os }}-${{ hashFiles('frontend/**', 'internal/**', 'main.go', 'go.mod', 'go.sum', 'Taskfile.yml', 'build/Taskfile.yml', '.github/workflows/prepare-frontend.yml') }}

            - name: Restore the bindings
              id: bindings
              if: steps.prepared.outputs.cache-hit != 'true'
              uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
              with:
                  path: frontend/bindings
                  key: bindings-${{ runner.os }}-${{ hashFiles('internal/**', 'main.go', 'go.mod', 'go.sum', 'Taskfile.yml', 'build/Taskfile.yml', '.github/workflows/prepare-frontend.yml') }}

            - name: Set up native compilation
              if: steps.prepared.outputs.cache-hit != 'true' && steps.bindings.outputs.cache-hit != 'true'
              uses: ./.github/actions/setup-native

            - name: Set up Go
              uses: ./.github/actions/setup-go
              with:
                  cache: frontend

            - name: Set up Bun
              uses: ./.github/actions/setup-bun

            - name: Install dependencies
              run: go tool -modfile build/tools/go.mod task setup:frontend

            - name: Generate bindings
              if: steps.prepared.outputs.cache-hit != 'true' && steps.bindings.outputs.cache-hit != 'true'
              run: go tool -modfile build/tools/go.mod task generate

            - name: Build
              if: steps.prepared.outputs.cache-hit != 'true'
              run: go tool -modfile build/tools/go.mod task frontend:build

            - name: Check source
              if: inputs.source-checks
              run: go tool -modfile build/tools/go.mod task check:frontend:source

            - name: Check types
              run: go tool -modfile build/tools/go.mod task check:frontend:types

            - name: Check that preparation did not change source files
              run: |
                  changes=$(git status --porcelain)
                  if [ -n "$changes" ]; then
                      printf 'Frontend preparation changed source files.\n%s\n' "$changes" >&2
                      exit 1
                  fi

            - name: Save the bindings
              if: steps.prepared.outputs.cache-hit != 'true' && steps.bindings.outputs.cache-hit != 'true'
              uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
              with:
                  path: frontend/bindings
                  key: ${{ steps.bindings.outputs.cache-primary-key }}

            - name: Save the prepared frontend
              if: steps.prepared.outputs.cache-hit != 'true'
              uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
              with:
                  path: |
                      frontend/bindings
                      frontend/dist
                  key: ${{ steps.prepared.outputs.cache-primary-key }}

            - name: Upload
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: ${{ env.ARTIFACT }}
                  path: |
                      frontend/bindings
                      frontend/dist
                  if-no-files-found: error
                  retention-days: 1
