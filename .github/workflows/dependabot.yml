name: Dependabot

on: pull_request

permissions:
    contents: write
    pull-requests: write

jobs:
    auto-merge:
        name: Auto-merge
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Enable auto-merge
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
              run: gh pr merge --auto --squash "$PR_URL"
