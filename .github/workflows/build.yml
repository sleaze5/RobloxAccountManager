name: "Build"

on:
    workflow_dispatch:
        inputs:
            target:
                description: "Target to build"
                required: true
                type: "choice"
                options:
                    - "windows-amd64"
                    - "windows-arm64"
                    - "linux-amd64"
                    - "darwin-arm64"
                    - "darwin-amd64"

permissions:
    contents: "read"

jobs:
    build:
        name: "Build ${{ inputs.target }}"
        runs-on: "${{ startsWith(inputs.target, 'windows-') && 'windows-2025' || startsWith(inputs.target, 'darwin-') && 'macos-15' || 'ubuntu-24.04' }}"
        timeout-minutes: 30
        env:
            CGO_ENABLED: "1"
            ARTIFACT: "RobloxAccountManager-${{ inputs.target }}-build-${{ github.run_number }}"
        steps:
            - name: "Pause Defender scanning"
              if: "runner.os == 'Windows'"
              shell: "pwsh"
              run: |
                  try {
                      Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
                  } catch {
                      Write-Warning "Defender scanning could not be paused: $_"
                  }

            - name: "Check out"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
              with:
                  persist-credentials: false

            - name: "Install system libraries"
              if: "runner.os == 'Linux'"
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

            - name: "Set up Go"
              uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e"
              with:
                  go-version-file: "go.mod"
                  cache-dependency-path: "go.sum"

            - name: "Set up Bun"
              uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
              with:
                  bun-version: "1.3.x"

            - name: "Set up Task"
              uses: "go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e"
              with:
                  version: "3.x"

            - name: "Set up ARM64 compiler"
              if: "inputs.target == 'windows-arm64'"
              uses: "./.github/actions/setup-llvm-mingw"

            - name: "Build"
              if: "runner.os == 'Windows'"
              shell: "pwsh"
              run: |
                  if ($env:LLVM_MINGW_BIN) {
                      # Append, so gcc still resolves to the runner's x64 MinGW.
                      $env:PATH = "$env:PATH;$env:LLVM_MINGW_BIN"
                  }
                  task "build:${{ inputs.target }}"
                  if ($LASTEXITCODE -ne 0) {
                      throw "Build failed with exit code $LASTEXITCODE"
                  }

            - name: "Build"
              if: "runner.os != 'Windows'"
              run: 'task "build:${{ inputs.target }}"'

            - name: "Package"
              if: "runner.os == 'Windows'"
              shell: "pwsh"
              run: |
                  $package = Join-Path $env:RUNNER_TEMP "package"
                  New-Item -ItemType Directory -Force -Path $package | Out-Null
                  Copy-Item -LiteralPath "dist/${{ inputs.target }}/RobloxAccountManager.exe" -Destination $package

            # Artifact uploads drop file modes, so keep the executable bit in an archive.
            - name: "Package"
              if: "runner.os != 'Windows'"
              run: |
                  set -eu
                  package="$RUNNER_TEMP/package"
                  mkdir -p "$package"
                  case "${{ inputs.target }}" in
                    linux-*) tar -czf "$package/$ARTIFACT.tar.gz" -C "dist/${{ inputs.target }}" RobloxAccountManager ;;
                    darwin-*) ditto -c -k --sequesterRsrc --keepParent "dist/${{ inputs.target }}/RobloxAccountManager.app" "$package/$ARTIFACT.zip" ;;
                  esac

            - name: "Upload"
              uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
              with:
                  name: "${{ env.ARTIFACT }}"
                  path: "${{ runner.temp }}/package"
                  if-no-files-found: "error"
                  retention-days: 7
