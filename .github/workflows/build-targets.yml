name: Build targets

on:
    workflow_call:
        inputs:
            targets:
                description: Space-separated build targets of one operating system
                required: true
                type: string
            artifact:
                description: Name of the uploaded artifact
                required: true
                type: string
            retention-days:
                description: Days to keep the artifact
                required: true
                type: number
            frontend-artifact:
                description: The artifact output of prepare-frontend.yml from the same run
                required: true
                type: string
            release:
                description: Build release versions from internal/appmeta/VERSION instead of development versions
                required: false
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    build:
        name: Build
        runs-on: ${{ startsWith(inputs.targets, 'windows-') && 'windows-2025' || startsWith(inputs.targets, 'darwin-') && 'macos-15' || 'ubuntu-24.04' }}
        timeout-minutes: 45
        env:
            # Windows needs no C compiler. Linux and macOS use cgo for the system web view.
            CGO_ENABLED: ${{ startsWith(inputs.targets, 'windows-') && '0' || '1' }}
            TARGETS: ${{ inputs.targets }}
            RELEASE_BUILD: ${{ inputs.release }}
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Set up native compilation
              uses: ./.github/actions/setup-native

            - name: Set up Go
              uses: ./.github/actions/setup-go
              with:
                  cache: production-${{ inputs.targets }}

            - name: Download the prepared frontend
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  name: ${{ inputs.frontend-artifact }}
                  path: frontend

            - name: Build
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  foreach ($target in $env:TARGETS -split " ") {
                      go tool -modfile build/tools/go.mod task "build:$target"
                      if ($LASTEXITCODE -ne 0) {
                          throw "Build $target failed with exit code $LASTEXITCODE"
                      }
                  }

            - name: Build
              if: runner.os != 'Windows'
              run: |
                  set -eu
                  for target in $TARGETS; do
                      go tool -modfile build/tools/go.mod task "build:$target"
                  done

            - name: Check that the build did not change source files
              shell: bash
              run: |
                  changes=$(git status --porcelain)
                  if [ -n "$changes" ]; then
                      printf 'The build changed source files.\n%s\n' "$changes" >&2
                      exit 1
                  fi

            - name: Package
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $package = Join-Path $env:RUNNER_TEMP "package"
                  New-Item -ItemType Directory -Force -Path $package | Out-Null
                  foreach ($target in $env:TARGETS -split " ") {
                      $executable = "dist/$target/RobloxAccountManager.exe"
                      switch ($target) {
                          "windows-amd64" {
                              Copy-Item -LiteralPath $executable -Destination $package
                              Compress-Archive -LiteralPath $executable -DestinationPath (Join-Path $package "RobloxAccountManager-windows-x64.zip")
                          }
                          "windows-arm64" {
                              Copy-Item -LiteralPath $executable -Destination (Join-Path $package "RobloxAccountManager-arm64.exe")
                              Compress-Archive -LiteralPath $executable -DestinationPath (Join-Path $package "RobloxAccountManager-windows-arm64.zip")
                          }
                          default { throw "No package is defined for $target" }
                      }
                  }

            - name: Package
              if: runner.os != 'Windows'
              run: |
                  set -eu
                  package="$RUNNER_TEMP/package"
                  mkdir -p "$package"
                  for target in $TARGETS; do
                      case "$target" in
                          linux-amd64) tar -czf "$package/RobloxAccountManager-linux-x64.tar.gz" -C "dist/$target" RobloxAccountManager ;;
                          darwin-arm64) ditto -c -k --sequesterRsrc --keepParent "dist/$target/RobloxAccountManager.app" "$package/RobloxAccountManager-macos-arm64.zip" ;;
                          darwin-amd64) ditto -c -k --sequesterRsrc --keepParent "dist/$target/RobloxAccountManager.app" "$package/RobloxAccountManager-macos-x64.zip" ;;
                          *) echo "No package is defined for $target" >&2; exit 1 ;;
                      esac
                  done

            - name: Upload
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: ${{ inputs.artifact }}
                  path: ${{ runner.temp }}/package
                  if-no-files-found: error
                  retention-days: ${{ inputs.retention-days }}
