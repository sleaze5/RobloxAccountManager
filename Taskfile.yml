version: "3"

vars:
    APP_NAME: RobloxAccountManager
    DIST_DIR: dist
    VITE_PORT: "{{.WAILS_VITE_PORT | default 9245}}"
    GOLANGCI_LINT: go tool -modfile=build/tools/go.mod golangci-lint
    GOVULNCHECK: go tool -modfile=build/tools/go.mod govulncheck

includes:
    common: ./build/Taskfile.yml
    windows: ./build/windows/Taskfile.yml
    linux: ./build/linux/Taskfile.yml
    darwin: ./build/darwin/Taskfile.yml

tasks:
    internal:validate-tools:
        internal: true
        run: once
        cmds:
            - go version
            - bun --version
            - "{{.TASK_EXE}} --version"

    setup:frontend:
        desc: Install the frontend dependencies from the lockfile.
        cmds:
            - task: common:internal:frontend:deps

    generate:
        desc: Generate the TypeScript bindings for the Wails services.
        cmds:
            - task: common:internal:generate:bindings

    frontend:build:
        desc: Build the production frontend from the generated bindings.
        cmds:
            - task: common:internal:frontend:build:production

    build:
        desc: Run fix, build the production frontend, then build TARGET. TARGET defaults to the host, such as linux-amd64.
        vars:
            TARGET: '{{.TARGET | default (printf "%s-%s" OS ARCH)}}'
        cmds:
            - task: fix
            - task: frontend:build
            - task: "build:{{.TARGET}}"

    internal:dev:build:
        internal: true
        deps:
            - task: common:internal:frontend:build:development
        cmds:
            - task: "{{OS}}:internal:compile"
              vars:
                  DEV: "true"
                  ARCH: "{{ARCH}}"

    internal:run:
        internal: true
        cmds:
            - task: "{{OS}}:internal:run"
              vars:
                  ARCH: "{{ARCH}}"

    dev:
        desc: Run fix, then start Wails development mode with hot reload. Keeps running until stopped.
        deps:
            - task: fix
        cmds:
            - go tool wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

    check:
        desc: Validate all source without changing files. Runs check:common and check:native.
        deps:
            - task: check:common
            - task: check:native

    check:common:
        desc: Validate source that does not depend on the operating system. Generates the bindings first.
        deps:
            - task: internal:validate-tools
        cmds:
            - task: common:internal:frontend:deps
            - task: common:internal:generate:bindings
            - task: internal:check:common

    internal:check:common:
        internal: true
        deps:
            - task: check:frontend:source
            - task: check:frontend:types
            - task: check:go

    check:frontend:source:
        desc: Check frontend formatting and lint, and that @wailsio/runtime matches go.mod.
        deps:
            - task: common:internal:frontend:runtime:check
            - task: common:internal:frontend:format:check
            - task: common:internal:frontend:lint

    check:frontend:types:
        desc: Type-check the frontend and scripts. Needs installed dependencies and generated bindings.
        cmds:
            - task: common:internal:frontend:check

    check:go:
        desc: Check Go formatting and that both Go modules are tidy.
        deps:
            - task: common:internal:go:format:check
            - task: common:internal:go:tidy:check

    check:native:
        desc: Validate and compile backend source for the current operating system.
        deps:
            - task: common:internal:go:lint
            - task: common:internal:go:build

    audit:
        desc: Report known vulnerabilities in Go and frontend dependencies without changing files. Needs network access.
        deps:
            - task: internal:validate-tools
        cmds:
            - task: common:internal:go:audit
            - task: common:internal:frontend:audit

    fix:
        desc: Apply safe formatting and lint fixes, then run check.
        deps:
            - task: internal:validate-tools
        cmds:
            - task: common:internal:frontend:runtime:sync
            - task: common:internal:frontend:deps
            - task: common:internal:generate:bindings
            - task: common:internal:frontend:format
            - task: common:internal:frontend:lint:fix
            - task: common:internal:go:format
            - task: common:internal:go:lint:fix
            - task: common:internal:go:tidy
            - task: check

    update:
        desc: Update the pinned Bun version, the Go toolchain, and every dependency to its latest minor or patch version, then run fix. Pass -- --uncovered to update only what Dependabot cannot. Needs network access.
        deps:
            - task: internal:validate-tools
        cmds:
            - bun run ./scripts/update-dependencies.ts {{.CLI_ARGS}}
            - task: fix

    update-cft-manifest:
        desc: Pin the latest Stable Chrome for Testing release for the managed browser. Needs network access.
        deps:
            - task: internal:validate-tools
        cmds:
            - bun run ./scripts/update-cft-manifest.ts

    build:windows-amd64:
        desc: Build the Windows x64 executable. Runs on Windows. Needs the production frontend from frontend:build.
        preconditions:
            - sh: test -s frontend/dist/index.html
              msg: The production frontend is missing. Run the build task, or frontend:build first.
        cmds:
            - task: windows:internal:compile
              vars:
                  DEV: "false"
                  ARCH: amd64

    build:windows-arm64:
        desc: Cross-compile the Windows ARM64 executable. Runs on x64 Windows with llvm-mingw. Needs the production frontend from frontend:build.
        preconditions:
            - sh: test -s frontend/dist/index.html
              msg: The production frontend is missing. Run the build task, or frontend:build first.
        cmds:
            - task: windows:internal:compile
              vars:
                  DEV: "false"
                  ARCH: arm64

    build:linux-amd64:
        desc: Build the Linux x64 executable. Runs on Linux. Needs the production frontend from frontend:build.
        preconditions:
            - sh: test -s frontend/dist/index.html
              msg: The production frontend is missing. Run the build task, or frontend:build first.
        cmds:
            - task: linux:internal:compile
              vars:
                  DEV: "false"

    build:darwin-arm64:
        desc: Build the macOS Apple silicon app bundle. Runs on macOS. Needs the production frontend from frontend:build.
        preconditions:
            - sh: test -s frontend/dist/index.html
              msg: The production frontend is missing. Run the build task, or frontend:build first.
        cmds:
            - task: darwin:internal:compile
              vars:
                  DEV: "false"
                  ARCH: arm64

    build:darwin-amd64:
        desc: Build the macOS Intel app bundle. Runs on macOS. Needs the production frontend from frontend:build.
        preconditions:
            - sh: test -s frontend/dist/index.html
              msg: The production frontend is missing. Run the build task, or frontend:build first.
        cmds:
            - task: darwin:internal:compile
              vars:
                  DEV: "false"
                  ARCH: amd64

    release:prepare:
        desc: Sign and verify the update manifest for the release archives. The Release workflow runs it.
        deps:
            - task: internal:validate-tools
        requires:
            vars:
                - RELEASE_DIR
                - TARGETS
                - REPOSITORY
                - SIGNING
        env:
            CGO_ENABLED: "0"
        cmds:
            - bun run ./scripts/release-prepare.ts "{{.RELEASE_DIR}}" "{{.TARGETS}}" "{{.REPOSITORY}}" "{{.SIGNING}}"

    clean:
        desc: Destructive and irreversible. Delete builds, dependencies, generated files, logs, and all portable data, including the account vault. Standard data roots are not touched. Asks for confirmation, and -y skips it.
        prompt: This deletes all portable data and logs, including the account vault. Continue?
        cmds:
            - bun run ./scripts/clean.ts "{{.ROOT_DIR}}"
