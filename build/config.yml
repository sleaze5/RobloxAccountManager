version: "3"

info:
    companyName: sleaze
    productName: Roblox Account Manager
    productIdentifier: com.github.sleaze5.robloxaccountmanager
    description: Roblox Account Manager
    copyright: Copyright (c) 2026 sleaze
    comments: A portable desktop application for storing and managing Roblox accounts.

dev_mode:
    root_path: .
    log_level: warn
    debounce: 1000
    ignore:
        dir:
            - .git
            - dist
            - frontend
            - node_modules
        watched_extension:
            - "*.go"
    git_ignore: true
    executes:
        - cmd: go tool wails3 task internal:dev:build
          type: blocking
        - cmd: go tool wails3 task common:internal:frontend:dev
          type: background
        - cmd: go tool wails3 task common:internal:frontend:wait
          type: blocking
        - cmd: go tool wails3 task internal:run
          type: primary
