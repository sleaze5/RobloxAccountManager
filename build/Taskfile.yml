version: "3"

tasks:
    internal:frontend:deps:
        internal: true
        run: "once"
        dir: "{{.ROOT_DIR}}/frontend"
        sources:
            - "package.json"
            - "bun.lock"
        generates:
            - "node_modules/.bin/oxfmt.exe"
            - "node_modules/.bin/oxlint.exe"
            - "node_modules/.bin/svelte-check.exe"
            - "node_modules/.bin/vite.exe"
        cmds:
            - "bun install --frozen-lockfile"

    internal:generate:bindings:
        internal: true
        run: "once"
        dir: "{{.ROOT_DIR}}"
        sources:
            - "main.go"
            - "go.mod"
            - "go.sum"
            - "internal/**/*.go"
        generates:
            - "frontend/bindings/github.com/sleaze5/RobloxAccountManager/internal/bindings/service.ts"
        cmds:
            - "go run {{.WAILS_CLI}} generate bindings -clean=true -ts -i"

    internal:frontend:format:
        internal: true
        dir: "{{.ROOT_DIR}}/frontend"
        cmds:
            - "bun run format"

    internal:frontend:format:check:
        internal: true
        dir: "{{.ROOT_DIR}}/frontend"
        cmds:
            - "bun run format:check"

    internal:frontend:lint:
        internal: true
        dir: "{{.ROOT_DIR}}/frontend"
        cmds:
            - "bun run lint"

    internal:frontend:lint:fix:
        internal: true
        dir: "{{.ROOT_DIR}}/frontend"
        cmds:
            - "bun run lint:fix"

    internal:frontend:check:
        internal: true
        dir: "{{.ROOT_DIR}}/frontend"
        cmds:
            - cmd:
                  "powershell -NoProfile -ExecutionPolicy Bypass -Command '& { $root = [IO.Path]::GetFullPath(\"{{.ROOT_DIR}}/frontend\"); $prefix = $root.TrimEnd([IO.Path]::DirectorySeparatorChar, [IO.Path]::AltDirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar; $cache = [IO.Path]::GetFullPath([IO.Path]::Combine($root, \".svelte-check\")); $exitCode = 1; try {

                  \    & bun run check;

                  \    $exitCode = $LASTEXITCODE;

                  } finally {

                  \    if (-not $cache.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) { throw \"Refusing to delete Svelte check cache outside frontend: $cache\" }

                  \    if (Test-Path -LiteralPath $cache) { Remove-Item -LiteralPath $cache -Recurse -Force -ErrorAction Stop }

                  } exit $exitCode }'"
              platforms: [windows]
            - cmd: |
                set -eu
                root=$(readlink -f "{{.ROOT_DIR}}/frontend")
                cache="$root/.svelte-check"
                case "$cache" in
                  "$root"/*) ;;
                  *) echo "Refusing to delete Svelte check cache outside frontend: $cache" >&2; exit 1 ;;
                esac
                status=0
                bun run check || status=$?
                if [ -e "$cache" ]; then
                  rm -rf -- "$cache"
                fi
                exit "$status"
              platforms: [linux]

    internal:frontend:update:
        internal: true
        dir: "{{.ROOT_DIR}}/frontend"
        cmds:
            - "bun update"

    internal:frontend:build:development:
        internal: true
        dir: "{{.ROOT_DIR}}/frontend"
        deps:
            - task: "internal:frontend:deps"
            - task: "internal:generate:bindings"
        cmds:
            - "bun run build:dev"

    internal:frontend:build:production:
        internal: true
        dir: "{{.ROOT_DIR}}/frontend"
        deps:
            - task: "internal:frontend:deps"
            - task: "internal:generate:bindings"
        cmds:
            - "bun run build"

    internal:frontend:dev:
        internal: true
        dir: "{{.ROOT_DIR}}/frontend"
        deps:
            - task: "internal:frontend:deps"
        cmds:
            - "bun run dev -- --port {{.VITE_PORT}} --strictPort"

    internal:frontend:wait:
        internal: true
        dir: "{{.ROOT_DIR}}"
        cmds:
            - cmd: "powershell -NoProfile -File ./build/windows/wait-for-vite.ps1 -Port {{.VITE_PORT}}"
              platforms: [windows]
            - cmd: "sh ./build/linux/wait-for-vite.sh {{.VITE_PORT}}"
              platforms: [linux]

    internal:go:format:
        internal: true
        dir: "{{.ROOT_DIR}}"
        cmds:
            - cmd: 'powershell -NoProfile -Command ''& { $files = @("main.go") + @(Get-ChildItem -LiteralPath "internal" -Recurse -File -Filter "*.go" | ForEach-Object FullName); & gofmt -w @files; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }'''
              platforms: [windows]
            - cmd: |
                set -eu
                find main.go internal -type f -name '*.go' -exec gofmt -w {} +
              platforms: [linux]

    internal:go:format:check:
        internal: true
        dir: "{{.ROOT_DIR}}"
        cmds:
            - cmd: 'powershell -NoProfile -Command ''& { $files = @("main.go") + @(Get-ChildItem -LiteralPath "internal" -Recurse -File -Filter "*.go" | ForEach-Object FullName); $unformatted = @(& gofmt -l @files); if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } if ($unformatted.Count -ne 0) { Write-Error ("Go files are not formatted:" + [Environment]::NewLine + ($unformatted -join [Environment]::NewLine)); exit 1 } }'''
              platforms: [windows]
            - cmd: |
                set -eu
                unformatted=$(find main.go internal -type f -name '*.go' -exec gofmt -l {} +)
                if [ -n "$unformatted" ]; then
                  printf 'Go files are not formatted:\n%s\n' "$unformatted" >&2
                  exit 1
                fi
              platforms: [linux]

    internal:go:tidy:
        internal: true
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "go mod tidy"

    internal:go:tidy:check:
        internal: true
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "go mod tidy -diff"

    internal:go:vet:
        internal: true
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "go vet ./internal/..."

    internal:go:staticcheck:
        internal: true
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "go run {{.STATICCHECK}} ./internal/..."

    internal:go:build:
        internal: true
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "go build ./internal/..."

    internal:go:update:
        internal: true
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "go get -u github.com/mutecomm/go-sqlcipher/v4 golang.org/x/crypto golang.org/x/sync golang.org/x/sys"
