version: "3"

tasks:
    internal:compile:
        internal: true
        dir: "{{.ROOT_DIR}}"
        vars:
            COMMIT:
                sh: '{{if ne .RELEASE_BUILD "true"}}{{.COMMIT_SCRIPT}}{{end}}'
        cmds:
            - cmd: |
                  set -eu
                  # Task does not override variables that the shell already sets.
                  export GOOS=linux GOARCH=amd64 CGO_ENABLED=1
                  output="{{.DIST_DIR}}/linux-amd64/{{.APP_NAME}}"
                  mkdir -p "$(dirname "$output")"
                  ldflags="-X github.com/sleaze5/RobloxAccountManager/internal/appmeta.buildTime=$(date +%s) -X github.com/sleaze5/RobloxAccountManager/internal/appmeta.commit={{.COMMIT}}"
                  if [ "{{.DEV}}" != "true" ]; then
                    go build -buildvcs=false -tags production -trimpath -ldflags="-w -s $ldflags" -o "$output" .
                  else
                    go build -buildvcs=false -ldflags="$ldflags" -o "$output" .
                  fi
    internal:run:
        internal: true
        dir: "{{.ROOT_DIR}}"
        cmds:
            - '"{{.DIST_DIR}}/linux-amd64/{{.APP_NAME}}"'
